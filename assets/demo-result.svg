  <style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}.t{font-size:24px;font-weight:600}.h{font-size:16px;font-weight:600}.p{font-size:14px;fill:#374151}.m{font-size:12px;fill:#6b7280}</style>
  <rect width="1200" height="420" fill="#fff"/><rect x="35" y="35" width="1130" height="350" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
